<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FAQ Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, transparent 40%),
                #080b12;

            color: white;
        }

        .container {
            width: 550px;
            max-width: 95%;

            padding: 35px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 25px;

            font-size: 30px;
        }

        #chat {
            margin-bottom: 20px;

            max-height: 300px;

            overflow-y: auto;

            padding: 5px;
        }

        .user-message {
            text-align: right;
            margin-bottom: 12px;
        }

        .user-message > span,
        .ai-message > span {
            display: inline-block;

            padding: 11px 15px;

            max-width: 80%;

            word-wrap: break-word;
        }

        .user-message > span {
            background: #00aaff;

            border-radius: 14px 14px 3px 14px;
        }

        .ai-message {
            text-align: left;
            margin-bottom: 15px;
        }

        .ai-message > span {
            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 14px 14px 14px 3px;

            line-height: 1.5;
        }

        .time {
            display: block;

            margin-top: 5px;

            font-size: 10px;

            color: rgba(255, 255, 255, 0.55);
        }

        .user-message .time {
            text-align: right;
        }

        .ai-message .time {
            text-align: left;
        }

        /* Typing animation */

        .typing-dots {
            display: inline-flex;

            gap: 4px;

            margin-left: 5px;

            vertical-align: middle;
        }

        .typing-dots span {
            display: block;

            width: 6px;
            height: 6px;

            padding: 0;

            background: #00aaff;

            border: none;

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }

        }

        .input-area {
            display: flex;

            gap: 10px;
        }

        input {
            flex: 1;

            min-width: 0;

            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 10px;

            outline: none;

            background: rgba(0, 0, 0, 0.3);

            color: white;

            font-size: 15px;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            padding: 14px 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background: #00aaff;

            color: white;

            font-weight: bold;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            background: #008ed6;
        }

        .clear-button {
            background: #333;
        }

        .clear-button:hover {
            background: #444;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;

                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .input-area {
                flex-direction: column;
            }

            input,
            button {
                width: 100%;
            }

            #chat {
                max-height: 350px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>🤖 FAQ Assistant</h1>


        <div id="chat">

            <div class="ai-message">

                <span>

                    🤖 Hello! I'm your FAQ Assistant.

                    <br>

                    Ask me anything about your account,
                    payments, orders, or support.

                    <small class="time">
                        Just now
                    </small>

                </span>

            </div>

        </div>


        <div class="input-area">

            <input
                id="question"
                type="text"
                placeholder="Ask your question..."
                onkeydown="if(event.key === 'Enter') askQuestion()"
            >


            <button onclick="askQuestion()">
                Ask
            </button>


            <button
                class="clear-button"
                onclick="clearChat()"
            >
                Clear
            </button>

        </div>

    </div>


    <script>

        function getTime() {

            return new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

        }


        async function askQuestion() {

            const question =
                document.getElementById("question").value.trim();

            const chat =
                document.getElementById("chat");


            if (!question) {

                chat.innerHTML += `
                    <div class="ai-message">

                        <span>

                            ⚠️ Please enter a question.

                            <small class="time">
                                ${getTime()}
                            </small>

                        </span>

                    </div>
                `;

                chat.scrollTop =
                    chat.scrollHeight;

                return;
            }


            // User message

            chat.innerHTML += `
                <div class="user-message">

                    <span>

                        ${question}

                        <small class="time">
                            ${getTime()}
                        </small>

                    </span>

                </div>
            `;


            // AI typing message

            const typingId =
                "typing-" + Date.now();


            chat.innerHTML += `
                <div class="ai-message" id="${typingId}">

                    <span>

                        🤖 AI is thinking

                        <span class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>

                    </span>

                </div>
            `;


            chat.scrollTop =
                chat.scrollHeight;


            document.getElementById(
                "question"
            ).value = "";


            try {

                const response =
                    await fetch(
                        "http://localhost:3000/api/faq",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server returned an error"
                    );

                }


                const data =
                    await response.json();


                // Remove typing message

                const typing =
                    document.getElementById(typingId);


                if (typing) {
                    typing.remove();
                }


                // AI answer

                chat.innerHTML += `
                    <div class="ai-message">

                        <span>

                            🤖 ${data.answer}

                            <small class="time">
                                ${getTime()}
                            </small>

                        </span>

                    </div>
                `;


                chat.scrollTop =
                    chat.scrollHeight;


            } catch (error) {

                const typing =
                    document.getElementById(typingId);


                if (typing) {
                    typing.remove();
                }


                chat.innerHTML += `
                    <div class="ai-message">

                        <span>

                            ❌ Cannot connect to FAQ server.

                            <small class="time">
                                ${getTime()}
                            </small>

                        </span>

                    </div>
                `;


                chat.scrollTop =
                    chat.scrollHeight;


                console.error(error);

            }

        }


        function clearChat() {

            document.getElementById(
                "question"
            ).value = "";


            document.getElementById(
                "chat"
            ).innerHTML = `
                <div class="ai-message">

                    <span>

                        🤖 Hello! I'm your FAQ Assistant.

                        <br>

                        Ask me anything about your account,
                        payments, orders, or support.

                        <small class="time">
                            Just now
                        </small>

                    </span>

                </div>
            `;

        }

    </script>

</body>

</html>
